<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do while loop</title>
    <script>
        var a = 1;
        do{
            document.write(a + " Hello Subin Mahat <br>");
            a = a + 1; //short for this is a++ 
        }while(a <= 10)
    </script>
</head>
<body>
    
</body>
</html>
