<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Box</title>
    <script>
        // prompt("What is your name ?" )

        var per = prompt("Enter your percentage : ");

        if (per >= 80 && per <= 100){
            document.write("You are in Merit.")
        }else if (per >= 60 && per < 80){
            document.write("You are in Ist Division.")
        }else if (per >= 45 && per < 60){
            document.write("You are in IInd Division.")
        }else if (per >= 33 && per < 45){
            document.write("You are in IIIrd Division.")
        }else if (per <33 ){
            document.write("You are in fail.")
        }else {
            document.write("Please Enter Valid Percentage.")
        }
    </script>
</head>
<body>
    
</body>
</html>
